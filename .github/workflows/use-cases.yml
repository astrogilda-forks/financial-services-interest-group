name: Use cases
on:
  pull_request:
    paths: ['docs/use-cases/**', 'tools/check_use_cases.py', '.github/workflows/use-cases.yml']
  push:
    branches: [main]
    paths: ['docs/use-cases/**', 'tools/check_use_cases.py', '.github/workflows/use-cases.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned corpus
        run: python -m pip install -r docs/use-cases/requirements.txt
      - name: Every case file follows the format and lists only corpus members
        run: python tools/check_use_cases.py
      - name: The pinned corpus replays as its manifest declares
        run: agent-evidence-vectors --corpus vectors-agent-audit-record
